[registration]
intro = """Привет 👋

Этот бот показывает твои оценки и уведомляет об изменениях
Данные автоматически достаются из таблиц ведомостей, которые добавляет администратор

Чтобы я нашел оценки, отправь ФИО в формате <code>Иванов Иван Иванович</code>"""
