[help]
greeting = "Рад тебя видеть{person}"
body = """
<b>Описание</b>
Бот для получения уведомлений об оценках из таблиц ведомостей
Информация обновляется каждые {period}
Доступ по приглашению администратора. ФИО вводится при первом входе

<b>Управление</b>
/notifications — включить или выключить уведомления
/grades — посмотреть свои оценки
/subject — все свои оценки по ID таблицы
/tables — список таблиц
/suggest — предложить таблицу

/cancel — отменить текущий ввод
/help — помощь"""
admin = """
<b>Админ</b>
/add — добавить таблицу
/pending — предложения на проверку
/refresh — обновить кэш и проверить изменения
/columns — исключить или вернуть столбцы
/remove — удалить таблицу
/members — список пользователей
/invite — создать ссылку на 24 часа (или /invite ЧАСЫ)
/rename ID ФИО — изменить ФИО пользователя
/revoke — заблокировать пользователя"""
contact = "Для связи: @{username}"

[access]
denied = "Доступ закрыт"
private = "Открой личный чат с ботом"
blocked = "Доступ заблокирован. Обратись к администратору"
expired = "Ссылка недействительна или срок её действия истёк. Обратись к администратору{contact}"

[registration]
intro = """Привет 👋

Этот бот показывает твои оценки и уведомляет об изменениях
Данные автоматически достаются из таблиц ведомостей, которые добавляет администратор

Чтобы я нашел оценки, отправь ФИО в формате <code>Иванов Иван Иванович</code>"""
welcome = "Добро пожаловать, {name}! Теперь я буду присылать уведомления о новых оценках. Управление — /help"
returning = "Привет, {name}!\n\nЗдесь можно посмотреть свои оценки и получать уведомления об изменениях"
invalid_name = "Нужно 2–3 полных слова"

[notifications]
enabled = "Уведомления включены"
disabled = "Уведомления выключены"
