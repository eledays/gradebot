[help]
greeting = "Рад тебя видеть, {person}"
greeting_anonymous = "Рад тебя видеть"
body = """
<b>Описание</b>
Бот для получения уведомлений об оценках из таблиц ведомостей
Информация обновляется каждые {period}

<b>Управление</b>
/notifications — включить или выключить уведомления
/grades — посмотреть свои оценки
/subject — все свои оценки по ID таблицы
/tables — список таблиц
/suggest — предложить таблицу

/cancel — отменить текущий ввод
/help — помощь

<i>Доступ к боту ограничен пригласительными ссылками. Данные взяты из публичных таблиц с docs.google.com</i>"""
admin = """
<b>Админ</b>
/add — добавить таблицу
/addtab — добавить новый лист существующей таблицы
/pending — предложения на проверку
/refresh — обновить кэш и проверить изменения
/columns — исключить или вернуть столбцы
/remove — удалить таблицу
/members — список пользователей
/invite — создать ссылку на 24 часа (или /invite ЧАСЫ)
/rename ID ФИО — изменить ФИО пользователя
/revoke — заблокировать пользователя"""
contact = "Для связи: @{username}"

[structure]
new_tabs = "Нужные новые листы можно добавить через /addtab"
reconfigure = "Проверьте настройки парсинга. Новые листы добавляются через /addtab. Для повторной настройки текущего листа удалите его через /remove и добавьте заново"

[access]
denied = "Доступ закрыт"
private = "Открой личный чат с ботом"
blocked = "Доступ заблокирован. Обратись к администратору"
